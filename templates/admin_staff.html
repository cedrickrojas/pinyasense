<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Staff Account Requests</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/pinya-icon.svg') }}">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
        }
        .container {
            max-width: 1100px;
            margin: 48px auto;
            padding: 0 20px 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
        }
        .header a {
            color: #6ee7b7;
            text-decoration: none;
            font-weight: 600;
        }
        .card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.35);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.15);
            text-align: left;
            vertical-align: middle;
        }
        th {
            color: #a7f3d0;
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: capitalize;
        }
        .status-pending { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
        .status-approved { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
        .status-rejected { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
        .status-inactive { background: rgba(148, 163, 184, 0.18); color: #cbd5e1; }
        .action-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            color: white;
            font-weight: 600;
        }
        .approve { background: #10b981; }
        .reject { background: #ef4444; }
        .deactivate { background: #f59e0b; }
        .reactivate { background: #3b82f6; }
        .muted { color: rgba(226,232,240,0.75); }
        .alert {
            margin-bottom: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            display: none;
        }
        .alert-success { background: rgba(16,185,129,0.15); color: #a7f3d0; border: 1px solid rgba(16,185,129,0.35); }
        .alert-error { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
        @media (max-width: 700px) {
            .container {
                margin: 0;
                padding: max(1rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
            }

            .header {
                align-items: flex-start;
                gap: 1rem;
                margin-bottom: 1rem;
            }

            .header h1 {
                font-size: 1.8rem;
                line-height: 1.1;
            }

            .header a {
                flex: 0 0 auto;
                max-width: 110px;
                text-align: right;
                line-height: 1.2;
            }

            .card {
                padding: 0.75rem;
                border-radius: 12px;
            }

            table, tbody {
                display: block;
                width: 100%;
            }

            thead {
                display: none;
            }

            tbody {
                display: grid;
                gap: 0.75rem;
            }

            tbody tr {
                display: grid;
                gap: 0;
                padding: 0.5rem;
                border: 1px solid rgba(148, 163, 184, 0.15);
                border-radius: 10px;
                background: rgba(15, 23, 42, 0.35);
            }

            td {
                display: grid;
                grid-template-columns: minmax(76px, 30%) minmax(0, 1fr);
                gap: 0.5rem;
                align-items: center;
                padding: 0.65rem 0.25rem;
                border-bottom: 1px solid rgba(148, 163, 184, 0.1);
                overflow-wrap: anywhere;
                word-break: break-word;
            }

            td::before {
                content: attr(data-label);
                color: #a7f3d0;
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
            }

            td:last-child {
                display: block;
                border-bottom: 0;
            }

            td:last-child::before {
                display: block;
                margin-bottom: 0.5rem;
            }

            .action-row {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.5rem;
            }

            button {
                min-height: 44px;
                padding: 0.65rem 0.5rem;
            }
        }
    </style>
    <script src="{{ url_for('static', filename='js/html-utils.js') }}"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-user-shield"></i> Staff Account Requests</h1>
            <a href="{{ dashboard_url }}"><i class="fas fa-arrow-left"></i> Back to dashboard</a>
        </div>

        <div id="alert" class="alert"></div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Registered</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="staffTableBody">
                    <tr><td colspan="7" class="muted">Loading staff requests...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchStaffRequests() {
            const response = await fetch('/api/admin/staff-requests', { credentials: 'same-origin' });
            const data = await response.json();
            if (!response.ok || !data.success) {
                showAlert(data.error || data.message || 'Unable to load staff requests.', 'error');
                return;
            }

            const rows = data.staff || [];
            const tbody = document.getElementById('staffTableBody');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="7" class="muted">No staff account requests found.</td></tr>';
                return;
            }

            tbody.innerHTML = rows.map((staff) => {
                const fullName = escapeHtml(staff.fullname || 'N/A');
                const email = escapeHtml(staff.email || 'N/A');
                const username = escapeHtml(staff.username || '-');
                const registered = staff.created_at ? new Date(staff.created_at).toLocaleString() : 'N/A';
                const status = ['pending', 'approved', 'inactive', 'rejected'].includes(staff.status) ? staff.status : 'pending';
                const statusClass = `status-${status}`;
                return `
                    <tr>
                        <td data-label="Full Name">${fullName}</td>
                        <td data-label="Email">${email}</td>
                        <td data-label="Username">${username}</td>
                        <td data-label="Registered">${registered}</td>
                        <td data-label="Role">${escapeHtml(staff.role || 'staff')}</td>
                        <td data-label="Status"><span class="badge ${statusClass}">${status}</span></td>
                        <td data-label="Actions">
                            <div class="action-row">
                                <button class="approve" data-email="${email}" data-status="approved">Approve</button>
                                <button class="reject" data-email="${email}" data-status="rejected">Reject</button>
                                <button class="${status === 'inactive' ? 'reactivate' : 'deactivate'}" data-email="${email}" data-status="${status === 'inactive' ? 'approved' : 'inactive'}">${status === 'inactive' ? 'Reactivate' : 'Deactivate'}</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            document.querySelectorAll('button[data-status]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const email = button.dataset.email;
                    const status = button.dataset.status;
                    if (status === 'rejected' && !window.confirm(`Reject and delete ${email}?`)) {
                        return;
                    }
                    await updateStaffStatus(email, status);
                });
            });
        }

        async function updateStaffStatus(email, status) {
            const response = await fetch(`/api/admin/staff-requests/${encodeURIComponent(email)}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
                showAlert(data.message || 'Failed to update staff status.', 'error');
                return;
            }
            showAlert(data.message || 'Staff status updated.', 'success');
            fetchStaffRequests();
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 5000);
        }

        fetchStaffRequests().catch(error => showAlert(error.message, 'error'));
    </script>
</body>
</html>
